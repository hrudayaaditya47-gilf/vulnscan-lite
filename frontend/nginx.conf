server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real static file falls back
    # to index.html so client-side routing (and hard refreshes on any
    # route) work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get a long cache lifetime — Vite fingerprints
    # filenames on every build, so a stale cache is never a problem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
